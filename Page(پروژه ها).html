<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پروژه ها</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      color: #f1fff5;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(136, 255, 0, 0.18), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(35, 190, 133, 0.23), transparent 40%),
        linear-gradient(135deg, #04381c, #11210b 55%, #0f785f);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image: radial-gradient(#9bffc0 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .message {
      position: relative;
      isolation: isolate;
      width: min(900px, 100%);
      padding: clamp(30px, 7vw, 76px) clamp(24px, 6vw, 68px);
      text-align: center;
      border: 1px solid rgba(150, 255, 190, .2);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(110, 255, 160, .09), rgba(255,255,255,.025));
      box-shadow: 0 24px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(210,255,225,.12);
      backdrop-filter: blur(16px);
      animation: appear 1s cubic-bezier(.2,.8,.2,1) both, float 6s ease-in-out 1s infinite;
    }

    .message::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -2px;
      border-radius: inherit;
      background: linear-gradient(120deg, #00ff88, transparent 35%, #39d98a 70%, #a5ffbd);
      filter: blur(22px);
      opacity: .23;
      animation: glow 5s ease-in-out infinite alternate;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4.6rem);
      line-height: 1.65;
      font-weight: 900;
      letter-spacing: -1.5px;
      background: linear-gradient(100deg, #ffffff 8%, #9dffc2 48%, #42e98a 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 35px rgba(0, 255, 136, .08);
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -7px; }
    }

    @keyframes glow {
      from { opacity: .14; }
      to { opacity: .4; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="message">
    <h1>در این قسمت پروژه ها قرار میگیرند</h1>
    
  </main>
  <h8>COMMING SOON</h8>
</body>
</html>
